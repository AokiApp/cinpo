import org.gradle.api.GradleException

import java.security.MessageDigest
import java.util.Locale

def detectCinpoOs = {
    String osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    if (osName.contains('linux')) {
        return 'linux'
    }
    if (osName.contains('mac') || osName.contains('darwin')) {
        return 'darwin'
    }
    if (osName.contains('windows')) {
        return 'windows'
    }
    return osName.replaceAll('[^a-z0-9]+', '-')
}

def detectCinpoArch = {
    String archName = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    if (archName == 'x86_64' || archName == 'amd64') {
        return 'amd64'
    }
    if (archName == 'aarch64' || archName == 'arm64') {
        return 'aarch64'
    }
    return archName.replaceAll('[^a-z0-9]+', '-')
}

// Oracle ships one simulator archive per host OS. They unpack to the same internal
// layout, but the archive format and the runtime binary name differ, so both the
// vendor file to read and the executable to configure are selected per OS.
def SIMULATOR_ARCHIVES = [
        'linux'  : 'java_card_devkit_simulator-linux-bin-v26.0-b_788-05-MAY-2026.tar.gz',
        'windows': 'java_card_devkit_simulator-win-bin-v26.0-b_788-05-MAY-2026.zip'
]

def SIMULATOR_EXECUTABLES = [
        'linux'  : 'jcsl',
        'windows': 'jcsw.exe'
]

// The simulator executable name is safe to resolve on any host: it is only used by
// the paths the simulator preparation produces, and that task only runs for projects
// that actually prepare a simulator.
ext.javaCardSimulatorExecutableName = SIMULATOR_EXECUTABLES[detectCinpoOs()] ?: 'jcsl'

ext.javaCardToolsArchive = layout.projectDirectory.file('vendor/java_card_devkit_tools-bin-v26.0-b_705-04-MAY-2026.zip')
ext.extractedJavaCardToolsDir = layout.buildDirectory.dir('cinpo-cache/jcdk')
ext.extractedJavaCardApiExportDir = layout.buildDirectory.dir('cinpo-cache/jcdk/api-exports')
ext.configuredJcslDir = layout.buildDirectory.dir("cinpo-cache/jcsl/${detectCinpoOs()}-${detectCinpoArch()}")
ext.extractedJavaCardToolsJar = extractedJavaCardToolsDir.map { it.file('tools/lib/tools.jar') }
ext.extractedJavaCardSocketProviderJar = extractedJavaCardToolsDir.map { it.file('simulator/client/COMService/socketprovider.jar') }
ext.extractedJavaCardConfiguratorJar = extractedJavaCardToolsDir.map { it.file('simulator/tools/Configurator.jar') }
ext.configuredJcsl = configuredJcslDir.map { it.file(javaCardSimulatorExecutableName) }

// The simulator archive name is resolved lazily on purpose. Projects that never
// prepare a simulator (for example a PC/SC-only consumer without the jcresim
// runtime) must still be able to configure the build, including on host OSes
// Oracle ships no simulator archive for. Resolving it below fails only when the
// simulator preparation actually runs.
ext.javaCardSimulatorArchiveName = providers.provider {
    String os = detectCinpoOs()
    String archiveName = SIMULATOR_ARCHIVES[os]
    if (archiveName == null) {
        throw new GradleException(
                "No Oracle Java Card simulator archive is known for OS '${os}'. " +
                        "Supported: ${SIMULATOR_ARCHIVES.keySet().join(', ')}.")
    }
    return archiveName
}
ext.javaCardSimulatorArchive = providers.provider {
    layout.projectDirectory.file("vendor/${javaCardSimulatorArchiveName.get()}")
}

// Checksums for the expected vendor files, pinned so a corrupted or rebundled
// Oracle archive fails loudly instead of producing a broken tools cache.
def TOOLS_CHECKSUM = '86443cb1b64c006456e524d91082ba25d5ebb0ee5506c6e4d7088350ce251d9d'
def SIMULATOR_CHECKSUMS = [
        'java_card_devkit_simulator-linux-bin-v26.0-b_788-05-MAY-2026.tar.gz': 'b8b999c3e1cfac5d56f7ef16654ce28c99cf472d96761d419a03ddf11f5811c0',
        'java_card_devkit_simulator-win-bin-v26.0-b_788-05-MAY-2026.zip'     : '5ab2efc69486989bcd73d0ed235f4f8348e82df262448fbc781dabd1bcb9b9c5'
]

// Capture the values the verify tasks need so their actions do not read script
// properties at execution time. This keeps the vendor checks compatible with the
// configuration cache even though the rest of the preparation script is not.
def toolsArchiveFile = javaCardToolsArchive.asFile
def toolsChecksum = TOOLS_CHECKSUM
def toolsMissingHint = "Please download it from the Oracle Java Card website and place it in the 'vendor' directory."

def simulatorOs = detectCinpoOs()
def simulatorVendorDir = layout.projectDirectory.dir('vendor').asFile
def simulatorArchives = SIMULATOR_ARCHIVES
def simulatorChecksums = SIMULATOR_CHECKSUMS
def simulatorMissingHint = "Please download it from the Oracle Java Card website and place it in the 'vendor' directory. " +
        "If you do not use the jcresim runtime, remove the cinpo-runtime-jcresim dependency from build.gradle instead."

def simulatorArchiveTree = {
    File archive = javaCardSimulatorArchive.get().asFile
    // The Linux kit is a gzipped tarball, the Windows kit a plain zip.
    return archive.name.endsWith('.zip') ? zipTree(archive) : tarTree(resources.gzip(archive))
}

// These keys are the jcdksim development keyset. They must stay in sync with the
// template's profile/jcdksim.yaml, which is the profile the default runs use.
// Changing the keyset means changing both places.
def configureJcslForJcdkSim = {
    File sourceRuntimeDir = extractedJavaCardToolsDir.get().file('simulator/runtime/bin').asFile
    File configuredRuntimeDir = configuredJcslDir.get().asFile
    File configuratorJar = extractedJavaCardConfiguratorJar.get().asFile
    File configuredJcslFile = configuredJcsl.get().asFile

    if (!sourceRuntimeDir.isDirectory()) {
        throw new GradleException("Expected Java Card simulator runtime directory was not found: ${sourceRuntimeDir}")
    }
    if (!extractedJavaCardSocketProviderJar.get().asFile.isFile()) {
        throw new GradleException("Expected Java Card socket terminal provider was not found: ${extractedJavaCardSocketProviderJar.get().asFile}")
    }
    if (!configuratorJar.isFile()) {
        throw new GradleException("Expected Java Card Configurator.jar was not found: ${configuratorJar}")
    }

    copy {
        from sourceRuntimeDir
        into configuredRuntimeDir
    }

    configuredJcslFile.setExecutable(true)

    String javaLauncher = detectCinpoOs() == 'windows' ? 'bin/java.exe' : 'bin/java'
    List<String> command = [
            new File(System.getProperty('java.home'), javaLauncher).absolutePath,
            '-jar', configuratorJar.absolutePath,
            '-binary', configuredJcslFile.absolutePath,
            '-force',
            '-SCP-keyset', '10',
            '1111111111111111111111111111111111111111111111111111111111111111',
            '2222222222222222222222222222222222222222222222222222222222222222',
            '3333333333333333333333333333333333333333333333333333333333333333',
            '-global-pin', '000000', '03'
    ]
    Process process = new ProcessBuilder(command)
            .redirectErrorStream(true)
            .start()
    String output = process.inputStream.getText('UTF-8')
    int exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new GradleException("Java Card Configurator failed with exit code ${exitCode}:\n${output}")
    }
    if (!output.isBlank()) {
        logger.lifecycle(output.trim())
    }

    configuredJcslFile.setExecutable(true)
}

def verifyConfiguredJcsl = {
    File configuredJcslFile = configuredJcsl.get().asFile
    // Windows has no POSIX execute bit; a .exe on disk is all that can be asserted there.
    boolean usable = detectCinpoOs() == 'windows' ? configuredJcslFile.isFile() : configuredJcslFile.canExecute()
    if (!usable) {
        throw new GradleException("Expected configured Java Card simulator executable was not found or is not executable: ${configuredJcslFile}")
    }
}

// Extract the Oracle tool jar and API jars into a directory this task owns. Sync
// removes stale files from previous runs; the vendor archive is a task input, so
// replacing the archive re-runs the extraction.
//
// The archive is verified by a separate task. Gradle snapshots the zipTree input
// before running the extraction action, so a missing archive would otherwise fail
// with "Cannot expand ZIP ... as it does not exist" before any friendly message.
def verifyJavaCardToolsArchive = tasks.register('verifyJavaCardToolsArchive') {
    group = 'cinpo'
    description = 'Checks that the vendor Java Card tools archive is present and unchanged.'
    doLast {
        File toolsFile = toolsArchiveFile
        if (!toolsFile.isFile()) {
            throw new GradleException("Required vendor file '${toolsFile.name}' is missing. ${toolsMissingHint}")
        }
        def digest = MessageDigest.getInstance('SHA-256')
        toolsFile.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        String actual = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        if (actual != toolsChecksum) {
            throw new GradleException("Checksum verification failed for '${toolsFile.name}'. Expected: ${toolsChecksum}, Actual: ${actual}. Please re-download the file and ensure it is not corrupted.")
        }
    }
}

def extractJavaCardTools = tasks.register('extractJavaCardTools', Sync) {
    group = 'cinpo'
    description = 'Extracts the Oracle Java Card tools and API jars.'
    dependsOn verifyJavaCardToolsArchive
    from(zipTree(javaCardToolsArchive.asFile)) {
        include 'lib/tools.jar'
        include 'lib/api_classic-*.jar'
    }
    into extractedJavaCardToolsDir.map { it.dir('tools') }
}

// tools.jar carries the API export trees as resources. The converter reads them
// from ordinary files, so extract every version once; the converter selects the
// manifest's version through its export search path. Keeping all of them makes
// this task independent of manifest.yaml.
def extractJavaCardApiExports = tasks.register('extractJavaCardApiExports', Sync) {
    group = 'cinpo'
    description = 'Extracts the Java Card API export trees from tools.jar.'
    dependsOn extractJavaCardTools
    from(zipTree(extractedJavaCardToolsJar.get().asFile)) {
        include 'api_export_files_*/**'
    }
    into extractedJavaCardApiExportDir
}

// Compatibility task: the framework build and the runtime modules depend on this
// name to bring both extraction tasks onto their classpaths.
tasks.register('prepareJavaCardTools') {
    group = 'cinpo'
    description = 'Extracts the Java Card tools and API export files used by CINPO.'
    dependsOn extractJavaCardTools, extractJavaCardApiExports
}

// Extract the simulator kit into a directory this task owns. The archive name is
// resolved lazily: a project that never schedules this task never asks for an
// archive its host OS does not have. As with the tools archive, verification runs
// before Gradle snapshots the extracted tree.
def verifyJavaCardSimulatorArchive = tasks.register('verifyJavaCardSimulatorArchive') {
    group = 'cinpo'
    description = 'Checks that the vendor Java Card simulator archive is present and unchanged.'
    doLast {
        String archiveName = simulatorArchives[simulatorOs]
        if (archiveName == null) {
            throw new GradleException("No Oracle Java Card simulator archive is known for OS '${simulatorOs}'. " +
                    "Supported: ${simulatorArchives.keySet().join(', ')}.")
        }
        File simulatorFile = new File(simulatorVendorDir, archiveName)
        if (!simulatorFile.isFile()) {
            throw new GradleException("Required vendor file '${simulatorFile.name}' is missing. ${simulatorMissingHint}")
        }
        String expectedChecksum = simulatorChecksums[archiveName]
        if (expectedChecksum == null) {
            throw new GradleException("No pinned checksum is known for vendor file '${simulatorFile.name}'.")
        }
        def digest = MessageDigest.getInstance('SHA-256')
        simulatorFile.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        String actualChecksum = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        if (actualChecksum != expectedChecksum) {
            throw new GradleException("Checksum verification failed for '${simulatorFile.name}'. Expected: ${expectedChecksum}, Actual: ${actualChecksum}. Please re-download the file and ensure it is not corrupted.")
        }
    }
}

def extractJavaCardSimulator = tasks.register('extractJavaCardSimulator', Sync) {
    group = 'cinpo'
    description = 'Extracts the Oracle Java Card simulator kit.'
    dependsOn verifyJavaCardSimulatorArchive
    from(providers.provider { simulatorArchiveTree() }) {
        include 'client/COMService/socketprovider.jar'
        include 'runtime/bin/**'
        include 'tools/Configurator.jar'
    }
    into extractedJavaCardToolsDir.map { it.dir('simulator') }
}

// Copy the extracted runtime to a project-owned directory and rekey it with
// Oracle's Configurator. The copy stays explicit because Configurator modifies
// the binary in place, and the raw vendor extraction must stay unmodified.
tasks.register('prepareJcresimSimulator') {
    group = 'cinpo'
    description = 'Extracts and configures the Oracle JCDK simulator used by the jcresim runtime.'
    dependsOn extractJavaCardSimulator
    inputs.dir extractedJavaCardToolsDir.map { it.dir('simulator/runtime/bin') }
    inputs.file extractedJavaCardConfiguratorJar
    inputs.property('hostOs', providers.provider { detectCinpoOs() })
    inputs.property('hostArch', providers.provider { detectCinpoArch() })
    inputs.property('javaHome', providers.provider { System.getProperty('java.home') })
    outputs.dir configuredJcslDir

    // Hand the platform-specific jcsl directory to consumers of this task (for
    // example CinpoJarTask) through the task's own extension, so no cross-plugin
    // property plumbing is needed.
    ext.configuredJcslDir = configuredJcslDir

    doLast {
        delete configuredJcslDir
        configureJcslForJcdkSim()
        verifyConfiguredJcsl()
    }
}

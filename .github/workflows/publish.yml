name: Publish Maven packages

on:
  workflow_dispatch:
  release:
    types:
      - published
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-maven-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make scripts executable
        run: chmod +x ./gradlew ./extract_vendor.sh

      - name: Extract vendor archives
        run: ./extract_vendor.sh
        env:
          VENDOR_PASSWORD: ${{ secrets.VENDOR_PASSWORD }}

      - name: Test
        run: ./gradlew test

      - name: Publish to GitHub Packages
        continue-on-error: true
        run: ./gradlew publishAllPublicationsToGithubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-template:
    name: Verify template builds
    needs: publish
    uses: ./.github/workflows/verify-template.yml
    with:
      ref: ${{ github.ref }}
    secrets:
      VENDOR_PASSWORD: ${{ secrets.VENDOR_PASSWORD }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

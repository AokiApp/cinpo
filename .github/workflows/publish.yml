name: Publish Maven packages

on:
  workflow_dispatch:
  release:
    types:
      - published
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-maven-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make scripts executable
        run: chmod +x ./gradlew ./extract_vendor.sh

      - name: Extract vendor archives
        run: ./extract_vendor.sh
        env:
          VENDOR_PASSWORD: ${{ secrets.VENDOR_PASSWORD }}

      - name: Test
        run: ./gradlew test

      - name: Publish to GitHub Packages
        run: ./gradlew publishAllPublicationsToGithubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare template vendor files
        run: |
          rm -rf template/vendor
          cp -a vendor template/vendor

      - name: Verify template cinpoRun
        working-directory: template
        run: ../gradlew --no-daemon --refresh-dependencies cinpoRun --args='--test'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build template cinpoJar
        working-directory: template
        run: ../gradlew --no-daemon --refresh-dependencies cinpoJar
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify template cinpoJar appliance
        working-directory: template
        run: java -jar build/libs/cinpo-appliance.jar write --test

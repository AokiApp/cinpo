name: Apply Spotless

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotless-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply_spotless:
    name: Apply Spotless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Apply Spotless to root modules
        run: ./gradlew spotlessApply
      - name: Apply Spotless to templates
        run: |
          set -euo pipefail
          for template in template/basic template/authenticated template/probe; do
            echo "::group::spotlessApply $template"
            chmod +x "$template/gradlew"
            (cd "$template" && ./gradlew spotlessApply)
            echo "::endgroup::"
          done
      - name: Commit and push changes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No Spotless changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply Spotless formatting"
          git push

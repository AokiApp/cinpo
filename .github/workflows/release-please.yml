# Release Please maintains the version and changelog. It does not create tags
# or GitHub Releases; the publish workflow tags the verified commit instead.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A fine-grained PAT is recommended so the release pull request triggers
      # CI. Pull requests opened with GITHUB_TOKEN do not start workflows.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

# Release Please maintains the version and changelog. It does not create tags
# or GitHub Releases; the release workflow tags the verified commit instead.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Pull requests opened with GITHUB_TOKEN do not start workflows. Run the
      # CI workflow manually for the release branch when it needs checking.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

name: Verify template builds

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Branch or tag to checkout"
        type: string
        required: true
    secrets:
      VENDOR_PASSWORD:
        required: true
      GH_PACKAGES_TOKEN:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Verify template builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure GitHub auth for standalone template fetches
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Make scripts executable
        run: chmod +x ./gradlew ./extract_vendor.sh ./bootstrap.sh

      - name: Extract vendor archives
        run: ./extract_vendor.sh
        env:
          VENDOR_PASSWORD: ${{ secrets.VENDOR_PASSWORD }}

      - name: Create project from template
        run: ./bootstrap.sh /tmp/cinpo-verify-project

      - name: Prepare vendor files
        run: cp -a vendor /tmp/cinpo-verify-project/vendor

      - name: Verify cinpoRun
        working-directory: /tmp/cinpo-verify-project
        run: ./gradlew --no-daemon --refresh-dependencies cinpoRun --args='--debug --test'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Build cinpoJar
        working-directory: /tmp/cinpo-verify-project
        run: ./gradlew --no-daemon cinpoJar
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Verify cinpoJar appliance
        working-directory: /tmp/cinpo-verify-project
        run: java -jar build/libs/cinpo-appliance.jar write --test

plugins {
    id 'java-library'
    id 'maven-publish'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/main/java-cli']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

dependencies {
    implementation 'org.yaml:snakeyaml:2.2'
    implementation 'info.picocli:picocli:4.7.6'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    testImplementation project(':cinpo-runtime-jcardengine')
    testImplementation project(':cinpo-runtime-jcdksim')
    testImplementation project(':cinpo-runtime-pcsc')
}

tasks.named('processResources') {
    from(rootProject.file('LICENSE.md')) {
        into 'META-INF/cinpo'
        rename { 'CINPO-LICENSE.md' }
    }
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
        into 'META-INF/cinpo'
    }
    from(rootProject.file('third-party/licenses')) {
        into 'META-INF/cinpo/third-party/globalplatformpro'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'cinpo'
            from components.java
        }
    }
    repositories {
        maven {
            name = 'githubPackages'
            url = uri('https://maven.pkg.github.com/AokiApp/cinpo')
            credentials {
                username = providers.gradleProperty('gpr.user')
                        .orElse(providers.environmentVariable('GITHUB_ACTOR'))
                        .orNull
                password = providers.gradleProperty('gpr.key')
                        .orElse(providers.environmentVariable('GITHUB_TOKEN'))
                        .orNull
            }
        }
        maven {
            name = 'staging'
            url = rootProject.layout.buildDirectory.dir('staging-maven-repository')
        }
    }

    publications.withType(MavenPublication).configureEach {
        pom {
            name = "CINPO ${artifactId}"
            description = 'Source-available Java Card applet installation and provisioning framework.'
            url = 'https://github.com/AokiApp/cinpo'
            licenses {
                license {
                    name = 'AokiApp Normative Application License - Tight 1.0.1'
                    url = 'https://github.com/AokiApp/cinpo/blob/main/LICENSE.md'
                    distribution = 'manual'
                    comments = 'Source-available license; this is not an OSI-approved open-source license.'
                }
            }
            scm {
                connection = 'scm:git:https://github.com/AokiApp/cinpo.git'
                developerConnection = 'scm:git:ssh://git@github.com/AokiApp/cinpo.git'
                url = 'https://github.com/AokiApp/cinpo'
            }
        }
    }
}

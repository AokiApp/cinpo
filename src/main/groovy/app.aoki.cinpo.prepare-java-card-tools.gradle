import org.gradle.api.GradleException

import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.util.Locale
import java.util.regex.Matcher
import java.util.regex.Pattern
import java.util.zip.ZipEntry
import java.util.zip.ZipInputStream
import java.util.zip.ZipOutputStream

def detectCinpoOs = {
    String osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    if (osName.contains('linux')) {
        return 'linux'
    }
    if (osName.contains('mac') || osName.contains('darwin')) {
        return 'darwin'
    }
    if (osName.contains('windows')) {
        return 'windows'
    }
    return osName.replaceAll('[^a-z0-9]+', '-')
}

def detectCinpoArch = {
    String archName = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    if (archName == 'x86_64' || archName == 'amd64') {
        return 'amd64'
    }
    if (archName == 'aarch64' || archName == 'arm64') {
        return 'aarch64'
    }
    return archName.replaceAll('[^a-z0-9]+', '-')
}

ext.javaCardToolsArchive = layout.projectDirectory.file('vendor/java_card_devkit_tools-bin-v26.0-b_705-04-MAY-2026.zip')
ext.javaCardSimulatorArchive = layout.projectDirectory.file('vendor/java_card_devkit_simulator-linux-bin-v26.0-b_788-05-MAY-2026.tar.gz')
ext.extractedJavaCardToolsDir = layout.buildDirectory.dir('cinpo-cache/jcdk')
ext.configuredJcslDir = layout.buildDirectory.dir("cinpo-cache/jcsl/${detectCinpoOs()}-${detectCinpoArch()}")
ext.extractedJavaCardToolsJar = extractedJavaCardToolsDir.map { it.file('tools/lib/tools.jar') }
ext.extractedJavaCardSocketProviderJar = extractedJavaCardToolsDir.map { it.file('simulator/client/COMService/socketprovider.jar') }
ext.extractedJavaCardConfiguratorJar = extractedJavaCardToolsDir.map { it.file('simulator/tools/Configurator.jar') }
ext.configuredJcsl = configuredJcslDir.map { it.file('jcsl') }

def targetApiVersionFromManifest = {
    File manifestFile = layout.projectDirectory.file('manifest.yaml').asFile
    if (!manifestFile.isFile()) {
        return null
    }

    // Keep this precompiled Gradle plugin independent from SnakeYAML. The manifest
    // schema keeps targetApiVersion as a top-level scalar, so a narrow line-oriented
    // parser is sufficient for deciding which Java Card API artifacts to stage.
    Pattern pattern = Pattern.compile(/^\s*targetApiVersion\s*:\s*["']?([^"'#]+)["']?\s*(?:#.*)?$/)
    for (String line : manifestFile.readLines('UTF-8')) {
        Matcher matcher = pattern.matcher(line)
        if (matcher.matches()) {
            String targetApiVersion = matcher.group(1).trim()
            if (targetApiVersion.isBlank()) {
                break
            }
            return targetApiVersion
        }
    }
    throw new GradleException("manifest.yaml must declare targetApiVersion before Java Card tools can be prepared.")
}

def targetApiClassicJarName = {
    String targetApiVersion = targetApiVersionFromManifest()
    return targetApiVersion == null ? 'api_classic-*.jar' : "api_classic-${targetApiVersion}.jar"
}

def isApiExportEntryForOtherVersion = { String entryName, String targetApiVersion ->
    if (targetApiVersion == null || !entryName.startsWith('api_export_files_')) {
        return false
    }
    String allowedPrefix = "api_export_files_${targetApiVersion}/"
    return !entryName.startsWith(allowedPrefix)
}

def filterToolsJarToTargetApi = {
    String targetApiVersion = targetApiVersionFromManifest()
    if (targetApiVersion == null) {
        return
    }

    File toolsJar = extractedJavaCardToolsJar.get().asFile
    File filteredToolsJar = new File(toolsJar.parentFile, "${toolsJar.name}.filtered")
    byte[] buffer = new byte[8192]

    toolsJar.withInputStream { rawInput ->
        filteredToolsJar.withOutputStream { rawOutput ->
            ZipInputStream input = new ZipInputStream(rawInput)
            ZipOutputStream output = new ZipOutputStream(rawOutput)
            try {
                ZipEntry entry
                while ((entry = input.nextEntry) != null) {
                    String entryName = entry.name
                    if (isApiExportEntryForOtherVersion(entryName, targetApiVersion)) {
                        input.closeEntry()
                        continue
                    }

                    ZipEntry copiedEntry = new ZipEntry(entryName)
                    copiedEntry.time = entry.time
                    if (entry.method == ZipEntry.STORED) {
                        copiedEntry.method = ZipEntry.STORED
                        copiedEntry.size = entry.size
                        copiedEntry.compressedSize = entry.compressedSize
                        copiedEntry.crc = entry.crc
                    }
                    output.putNextEntry(copiedEntry)
                    if (!entry.directory) {
                        int read
                        while ((read = input.read(buffer)) != -1) {
                            output.write(buffer, 0, read)
                        }
                    }
                    output.closeEntry()
                    input.closeEntry()
                }
            } finally {
                output.close()
                input.close()
            }
        }
    }

    Files.move(filteredToolsJar.toPath(), toolsJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
}

def verifyDownloadedVendorFiles = {
    def vendorDir = file('vendor')
    def requiredVendorFiles = [
        'java_card_devkit_simulator-linux-bin-v26.0-b_788-05-MAY-2026.tar.gz': 'b8b999c3e1cfac5d56f7ef16654ce28c99cf472d96761d419a03ddf11f5811c0',
        'java_card_devkit_tools-bin-v26.0-b_705-04-MAY-2026.zip': '86443cb1b64c006456e524d91082ba25d5ebb0ee5506c6e4d7088350ce251d9d'
    ]

    def computeSHA256 = { File file ->
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        file.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        digest.digest().collect { String.format('%02x', it & 0xff) }.join()
    }

    requiredVendorFiles.each { fileName, expectedChecksum ->
        def vendorFile = new File(vendorDir, fileName)
        if (!vendorFile.exists()) {
            throw new GradleException("Required vendor file '${fileName}' is missing. Please download it from the Oracle Java Card website and place it in the 'vendor' directory.")
        }
        def actualChecksum = computeSHA256(vendorFile)
        if (actualChecksum != expectedChecksum) {
            throw new GradleException("Checksum verification failed for '${fileName}'. Expected: ${expectedChecksum}, Actual: ${actualChecksum}. Please re-download the file and ensure it is not corrupted.")
        }
    }
}

def verifyExtractedJavaCardFiles = {
    String targetApiVersion = targetApiVersionFromManifest()
    if (!extractedJavaCardToolsJar.get().asFile.exists()) {
        throw new GradleException("Expected Java Card tools jar was not found after extracting '${javaCardToolsArchive.asFile.name}' to '${extractedJavaCardToolsDir.get().asFile}'.")
    }
    if (!extractedJavaCardSocketProviderJar.get().asFile.exists()) {
        throw new GradleException("Expected Java Card simulator files were not found after extracting '${javaCardSimulatorArchive.asFile.name}' to '${extractedJavaCardToolsDir.get().asFile}'.")
    }
    if (!extractedJavaCardConfiguratorJar.get().asFile.exists()) {
        throw new GradleException("Expected Java Card Configurator.jar was not found after extracting '${javaCardSimulatorArchive.asFile.name}' to '${extractedJavaCardToolsDir.get().asFile}'.")
    }
    if (targetApiVersion != null) {
        File targetApiJar = extractedJavaCardToolsDir.get().file("tools/lib/api_classic-${targetApiVersion}.jar").asFile
        if (!targetApiJar.exists()) {
            throw new GradleException("Expected Java Card API jar for targetApiVersion ${targetApiVersion} was not found: ${targetApiJar}")
        }
    }
}

def configureJcslForJcdkSim = {
    File sourceRuntimeDir = extractedJavaCardToolsDir.get().file('simulator/runtime/bin').asFile
    File configuredRuntimeDir = configuredJcslDir.get().asFile
    File configuratorJar = extractedJavaCardConfiguratorJar.get().asFile
    File configuredJcslFile = configuredJcsl.get().asFile

    if (!sourceRuntimeDir.isDirectory()) {
        throw new GradleException("Expected Java Card simulator runtime directory was not found: ${sourceRuntimeDir}")
    }

    copy {
        from sourceRuntimeDir
        into configuredRuntimeDir
    }

    configuredJcslFile.setExecutable(true)

    List<String> command = [
            new File(System.getProperty('java.home'), 'bin/java').absolutePath,
            '-jar', configuratorJar.absolutePath,
            '-binary', configuredJcslFile.absolutePath,
            '-force',
            '-SCP-keyset', '10',
            '1111111111111111111111111111111111111111111111111111111111111111',
            '2222222222222222222222222222222222222222222222222222222222222222',
            '3333333333333333333333333333333333333333333333333333333333333333',
            '-global-pin', '000000', '03'
    ]
    Process process = new ProcessBuilder(command)
            .redirectErrorStream(true)
            .start()
    String output = process.inputStream.getText('UTF-8')
    int exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new GradleException("Java Card Configurator failed with exit code ${exitCode}:\n${output}")
    }
    if (!output.isBlank()) {
        logger.lifecycle(output.trim())
    }

    configuredJcslFile.setExecutable(true)
}

def verifyConfiguredJcsl = {
    if (!configuredJcsl.get().asFile.canExecute()) {
        throw new GradleException("Expected configured Java Card simulator executable was not found or is not executable: ${configuredJcsl.get().asFile}")
    }
}

tasks.register('prepareJavaCardTools') {
    outputs.dir extractedJavaCardToolsDir
    outputs.dir configuredJcslDir

    doLast {
        verifyDownloadedVendorFiles()

        delete extractedJavaCardToolsDir
        delete configuredJcslDir
        String apiClassicJarName = targetApiClassicJarName()
        copy {
            from(zipTree(javaCardToolsArchive.asFile)) {
                include 'lib/tools.jar'
                include "lib/${apiClassicJarName}"
                into 'tools'
            }
            from(tarTree(resources.gzip(javaCardSimulatorArchive.asFile))) {
                include 'client/COMService/socketprovider.jar'
                include 'runtime/bin/**'
                include 'tools/Configurator.jar'
                into 'simulator'
            }
            into extractedJavaCardToolsDir
        }

        filterToolsJarToTargetApi()
        verifyExtractedJavaCardFiles()
        configureJcslForJcdkSim()
        verifyConfiguredJcsl()
    }
}
